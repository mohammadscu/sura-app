<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سورا — SURA OPS</title>
<meta name="description" content="تطبيق سورا للسفر والسياحة — النظام الداخلي">
<meta name="theme-color" content="#14213d">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="سورا">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root { --navy: #14213d; --gold: #b8913a; --paper: #fffdf8; }
  html, body { margin: 0; height: 100%; background: var(--paper); font-family: Tahoma, "Segoe UI", Arial, sans-serif; }
  /* the status-bar band is navy (like the system's top bar); the system reaches the very bottom of the screen and pads its
     own bottom bar for the iPhone home bar (the shell tells it the size) — every iPhone, iPad and Android phone / tablet.
     29-10-2026: an iPhone home-screen app (iOS 26) gives a page that is shorter than the screen a view that ends a status
     bar's height above the bottom (WebKit bug 301108) — the navy strip under the bottom bar. A page at least as tall as the
     screen gets the whole screen, so the page is made that tall (only as a home-screen app; never taller than needed).
     Anything left under the system is white, never navy. */
  @media (display-mode: standalone) { html { min-height: min(100lvh, calc(100% + env(safe-area-inset-top))); } }
  html.ios-app { min-height: min(100lvh, calc(100% + env(safe-area-inset-top))); }
  #sb { position: fixed; left: 0; right: 0; top: 0; height: env(safe-area-inset-top); background: var(--navy); }
  #app { position: fixed; left: 0; top: env(safe-area-inset-top); width: 100%; height: calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    border: 0; background: var(--paper); display: block; }
  #probe { position: fixed; left: 0; top: 0; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #splash { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; background: var(--navy); color: #fff; transition: opacity .25s; }
  #splash.gone { opacity: 0; pointer-events: none; }
  #splash .box { text-align: center; }
  #splash img { width: 96px; height: 96px; border-radius: 22px; background: #fff; display: block; margin: 0 auto 14px; }
  #splash p { margin: 0; font-size: 15px; color: #e6dcc3; }
  #splash .dot { display: inline-block; width: 7px; height: 7px; margin: 14px 3px 0; border-radius: 50%; background: var(--gold); animation: b 1s infinite ease-in-out; }
  #splash .dot:nth-child(2) { animation-delay: .15s; } #splash .dot:nth-child(3) { animation-delay: .3s; }
  @keyframes b { 0%, 80%, 100% { transform: scale(.5); opacity: .5; } 40% { transform: scale(1); opacity: 1; } }
  #bar { position: fixed; z-index: 6; left: 10px; right: 10px; top: calc(env(safe-area-inset-top) + 64px); display: none;
    background: #fff; color: var(--navy); border: 1px solid #e3d6b4; border-top: 4px solid var(--gold); border-radius: 12px;
    box-shadow: 0 10px 30px rgba(20,33,61,.25); padding: 12px 14px; font-size: 14px; line-height: 1.6; max-width: 520px; margin: 0 auto; }
  #bar.on { display: block; }
  #bar .acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  #bar button { font: inherit; font-weight: 700; border-radius: 9px; padding: 8px 14px; cursor: pointer; border: 1px solid #d8cdb2; background: #fff; color: var(--navy); }
  #bar button.go { background: var(--navy); color: #fff; border-color: var(--navy); }
</style>
</head>
<body>
<div id="splash" aria-live="polite"><div class="box"><img src="icon-192.png" alt=""><p>جارٍ فتح نظام سورا…</p><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>
<div id="sb"></div>
<div id="probe"></div>
<iframe id="app" title="SURA OPS" allow="geolocation *; clipboard-read *; clipboard-write *; fullscreen *; web-share *"></iframe>
<div id="bar" role="dialog" aria-live="polite"><div id="bar-text"></div><div class="acts" id="bar-acts"></div></div>
<script>
(function () {
  'use strict';
  // «تطبيق سورا» (29-10-2026): shows the SURA OPS system full screen and keeps for it, on this address, what an iPhone
  // would otherwise wipe each time the browser is left: the sign-in, the language and the settings. It answers only the
  // system's own pages (Apps Script on googleusercontent.com) and shows notifications the system asks for.
  var PROD = 'https://script.google.com/macros/s/AKfycbwTv8nNw9E1GB8q_lhbuX0M7b4npS8RgnIMLY1uS37kORpDnRIETFv9o76kOO6Uy0u4/exec';
  var TEST = 'https://script.google.com/macros/s/AKfycbw0ZXQbNhHpbKyn9Sqa0aXMjcpeOc5dUux0aT5YjlcZ430_nlsmf45oMCG0vPKwdGHj/exec';
  var q = new URLSearchParams(location.search);
  var test = q.get('env') === 'test';
  var KEY = test ? 'sura-test:' : 'sura:';           // TEST keeps its own values
  var frame = document.getElementById('app'), splash = document.getElementById('splash');
  if (window.navigator.standalone) document.documentElement.classList.add('ios-app');   // iPhone / iPad home-screen app
  var appWin = null, appOrigin = '';
  function okOrigin(o) { return /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(o); }
  function store() { try { return window.localStorage; } catch (e) { return null; } }
  function all() {
    var s = store(), out = {};
    if (!s) return out;
    for (var i = 0; i < s.length; i++) { var k = s.key(i); if (k && k.indexOf(KEY) === 0) out[k.slice(KEY.length)] = s.getItem(k); }
    return out;
  }
  function standalone() { return !!((window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone); }
  function insets() {
    var cs = window.getComputedStyle(document.getElementById('probe'));
    return { top: parseFloat(cs.paddingTop) || 0, right: parseFloat(cs.paddingRight) || 0, bottom: parseFloat(cs.paddingBottom) || 0, left: parseFloat(cs.paddingLeft) || 0 };
  }
  // this page's own version: «version.json» on the site says when a newer one is published (then the system shows «1»
  // on Settings and «تحديث الآن» reloads this page too). Change both together with every change of this page.
  var SHELL_V = '29-10-2026.2';
  var newer = '';                          // the newer version, once seen
  var frameH = 0;
  function info() {
    var sc = window.screen || {};
    return { standalone: standalone(), notify: ('Notification' in window) ? Notification.permission : 'unsupported', test: test, v: 3, sv: SHELL_V,
      update: !!newer, insets: insets(), scr: { w: sc.width || 0, h: sc.height || 0 }, iw: window.innerWidth, ih: window.innerHeight, fh: frameH };
  }
  // the system fills the screen from under the status bar to the very bottom, whatever the device and its orientation
  var lastSize = '', fullBottom = false;   // fullBottom: the system pads its own bottom bar (it said so in «hello»)
  function layout() {
    var ins = insets(), h = Math.max(240, Math.round(window.innerHeight - ins.top - (fullBottom ? 0 : ins.bottom)));
    frame.style.top = ins.top + 'px';
    frame.style.height = h + 'px';
    frameH = h;
    var size = [ins.top, ins.right, ins.bottom, ins.left, h, window.innerWidth, window.innerHeight].join(',');
    if (size !== lastSize) { lastSize = size; tellInfo(); }
  }
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function () { setTimeout(layout, 250); setTimeout(layout, 800); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { setTimeout(layout, 300); checkNewer(false); } });
  // a newer version of this page on the site? (asked when the app opens, comes back to the front, and every 30 minutes)
  var lastAsk = 0;
  function checkNewer(force) {
    if (!force && Date.now() - lastAsk < 10 * 60000) return;
    lastAsk = Date.now();
    if (!window.fetch) return;
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      var v = j && typeof j.v === 'string' ? j.v : '';
      if (v && v !== SHELL_V && v !== newer) { newer = v; tellInfo(); }
    }, function () { /* offline: ask again later */ });
  }
  setInterval(function () { checkNewer(true); }, 30 * 60000);
  // «تحديث الآن»: the newest system and the newest version of this page (the address changes a little so no old copy is used)
  function reloadAll() {
    var done = false;
    var go = function () {
      if (done) return; done = true;
      var p = new URLSearchParams(location.search);
      p.set('v', newer || SHELL_V);
      p.set('r', String(Date.now() % 100000));
      location.replace(location.pathname + '?' + p.toString());
    };
    try { if (reg && reg.update) { reg.update().then(go, go); setTimeout(go, 2500); return; } } catch (e) { /* ignore */ }
    go();
  }
  function hideSplash() { splash.classList.add('gone'); setTimeout(function () { splash.style.display = 'none'; }, 300); }
  setTimeout(hideSplash, 15000);

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.so !== 1 || !okOrigin(e.origin) || e.source !== frame.contentWindow && !isInside(e.source)) return;
    if (d.t === 'hello') {
      appWin = e.source; appOrigin = e.origin;
      if (d.caps && d.caps.indexOf && d.caps.indexOf('insets') >= 0 && !fullBottom) { fullBottom = true; layout(); }
      e.source.postMessage({ so: 1, t: 'all', items: all(), info: info() }, e.origin);
      hideSplash();
      setTimeout(offer, 4000);
      setTimeout(function () { checkNewer(true); }, 3000);
    } else if (d.t === 'set' && typeof d.k === 'string' && /^(so|sura)\.[A-Za-z0-9_.-]{1,60}$/.test(d.k)) {
      var s = store();
      if (s) try { if (d.v === '' || d.v == null) s.removeItem(KEY + d.k); else s.setItem(KEY + d.k, String(d.v)); } catch (err) { /* full */ }
    } else if (d.t === 'notify') {
      notify(d);
    } else if (d.t === 'perm') {
      askNotify();
    } else if (d.t === 'reload') {
      reloadAll();                              // «تحديث الآن»: the newest published version
    }
  });
  // the system's page sits inside Google's own frame: accept messages from any frame inside ours
  function isInside(w) {
    try { for (var x = w, n = 0; x && n < 6; n++) { if (x === frame.contentWindow) return true; if (x === x.parent) break; x = x.parent; } } catch (e) {}
    return false;
  }

  // ---- notifications ----------------------------------------------------------------------------------------
  var reg = null;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (r) { reg = r; }, function () {});
  function notify(d) {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    var title = String(d.title || 'سورا').slice(0, 120);
    var opts = { body: String(d.body || '').slice(0, 400), icon: 'icon-192.png', badge: 'icon-192.png', dir: 'rtl', lang: 'ar' };
    if (d.tag) opts.tag = String(d.tag).slice(0, 60);
    if (reg && reg.showNotification) reg.showNotification(title, opts).catch(function () {});
    else try { new Notification(title, opts); } catch (e) { /* Android needs the service worker */ }
  }
  function askNotify() {
    if (!('Notification' in window) || Notification.permission !== 'default') { closeBar(); return; }
    Promise.resolve(Notification.requestPermission()).then(function () { closeBar(); tellInfo(); }, closeBar);
  }
  function tellInfo() { try { if (appWin) appWin.postMessage({ so: 1, t: 'info', info: info() }, appOrigin); } catch (e) { /* ignore */ } }

  // ---- one small offer at a time: install the app / allow notifications -------------------------------------
  var bar = document.getElementById('bar'), barText = document.getElementById('bar-text'), barActs = document.getElementById('bar-acts');
  var deferred = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; });
  function later(k) { var s = store(); if (s) try { s.setItem('shell:later:' + k, String(Date.now())); } catch (e) {} }
  function wait(k, days) { var s = store(); var t = s ? Number(s.getItem('shell:later:' + k) || 0) : 0; return t && Date.now() - t < days * 86400000; }
  function closeBar() { bar.classList.remove('on'); }
  function show(text, actions) {
    barText.textContent = text;
    while (barActs.firstChild) barActs.removeChild(barActs.firstChild);
    actions.forEach(function (a) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = a[0]; if (a[2]) b.className = 'go';
      b.addEventListener('click', a[1]); barActs.appendChild(b);
    });
    bar.classList.add('on');
  }
  function offer() {
    var ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    if (!standalone() && ios && !wait('ios', 7)) {
      show('📲 لتثبيت «تطبيق سورا» على الآيفون: اضغط زر المشاركة ⬆️ في Safari ثم «إضافة إلى الشاشة الرئيسية». بعدها افتحه من الأيقونة.',
        [['فهمت', function () { later('ios'); closeBar(); }, true]]);
      return;
    }
    if (!standalone() && deferred && !wait('install', 7)) {
      show('📲 ثبّت «تطبيق سورا» على هذا الجهاز ليفتح من أيقونة مثل أي تطبيق.',
        [['تثبيت', function () { closeBar(); deferred.prompt(); deferred = null; }, true], ['لاحقاً', function () { later('install'); closeBar(); }]]);
      return;
    }
    if ('Notification' in window && Notification.permission === 'default' && !wait('notify', 3)) {
      show('🔔 اسمح بالإشعارات حتى توصلك تنبيهات نظام سورا على هذا الجهاز.',
        [['السماح', askNotify, true], ['لاحقاً', function () { later('notify'); closeBar(); }]]);
    }
  }

  layout();
  frame.src = test ? TEST : PROD;
})();
</script>
</body>
</html>
