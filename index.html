<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سورا — SURA OPS</title>
<meta name="description" content="تطبيق سورا للسفر والسياحة — النظام الداخلي">
<meta name="theme-color" content="#14213d">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="سورا">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root { --navy: #14213d; --gold: #b8913a; --paper: #fffdf8; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--navy); font-family: Tahoma, "Segoe UI", Arial, sans-serif; }
  /* the status-bar band is navy (like the system's top bar), the home-indicator band light (like its bottom bar) */
  body { background: linear-gradient(var(--navy) 0 50%, var(--paper) 50% 100%); }
  #app { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top); bottom: env(safe-area-inset-bottom);
    width: 100%; height: calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom)); border: 0; background: var(--paper); }
  #splash { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; background: var(--navy); color: #fff; transition: opacity .25s; }
  #splash.gone { opacity: 0; pointer-events: none; }
  #splash .box { text-align: center; }
  #splash img { width: 96px; height: 96px; border-radius: 22px; background: #fff; display: block; margin: 0 auto 14px; }
  #splash p { margin: 0; font-size: 15px; color: #e6dcc3; }
  #splash .dot { display: inline-block; width: 7px; height: 7px; margin: 14px 3px 0; border-radius: 50%; background: var(--gold); animation: b 1s infinite ease-in-out; }
  #splash .dot:nth-child(2) { animation-delay: .15s; } #splash .dot:nth-child(3) { animation-delay: .3s; }
  @keyframes b { 0%, 80%, 100% { transform: scale(.5); opacity: .5; } 40% { transform: scale(1); opacity: 1; } }
  #bar { position: fixed; z-index: 6; left: 10px; right: 10px; top: calc(env(safe-area-inset-top) + 64px); display: none;
    background: #fff; color: var(--navy); border: 1px solid #e3d6b4; border-top: 4px solid var(--gold); border-radius: 12px;
    box-shadow: 0 10px 30px rgba(20,33,61,.25); padding: 12px 14px; font-size: 14px; line-height: 1.6; max-width: 520px; margin: 0 auto; }
  #bar.on { display: block; }
  #bar .acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  #bar button { font: inherit; font-weight: 700; border-radius: 9px; padding: 8px 14px; cursor: pointer; border: 1px solid #d8cdb2; background: #fff; color: var(--navy); }
  #bar button.go { background: var(--navy); color: #fff; border-color: var(--navy); }
</style>
</head>
<body>
<div id="splash" aria-live="polite"><div class="box"><img src="icon-192.png" alt=""><p>جارٍ فتح نظام سورا…</p><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>
<iframe id="app" title="SURA OPS" allow="geolocation *; clipboard-read *; clipboard-write *; fullscreen *; web-share *"></iframe>
<div id="bar" role="dialog" aria-live="polite"><div id="bar-text"></div><div class="acts" id="bar-acts"></div></div>
<script>
(function () {
  'use strict';
  // «تطبيق سورا» (29-10-2026): shows the SURA OPS system full screen and keeps for it, on this address, what an iPhone
  // would otherwise wipe each time the browser is left: the sign-in, the language and the settings. It answers only the
  // system's own pages (Apps Script on googleusercontent.com) and shows notifications the system asks for.
  var PROD = 'https://script.google.com/macros/s/AKfycbwTv8nNw9E1GB8q_lhbuX0M7b4npS8RgnIMLY1uS37kORpDnRIETFv9o76kOO6Uy0u4/exec';
  var TEST = 'https://script.google.com/macros/s/AKfycbxu52uwyPF2qBggxXNyNMbRGqfl98K_qEXkvn91xb0/dev';
  var q = new URLSearchParams(location.search);
  var test = q.get('env') === 'test';
  var KEY = test ? 'sura-test:' : 'sura:';           // TEST keeps its own values
  var frame = document.getElementById('app'), splash = document.getElementById('splash');
  var appWin = null, appOrigin = '';
  function okOrigin(o) { return /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(o); }
  function store() { try { return window.localStorage; } catch (e) { return null; } }
  function all() {
    var s = store(), out = {};
    if (!s) return out;
    for (var i = 0; i < s.length; i++) { var k = s.key(i); if (k && k.indexOf(KEY) === 0) out[k.slice(KEY.length)] = s.getItem(k); }
    return out;
  }
  function standalone() { return !!((window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone); }
  function info() {
    return { standalone: standalone(), notify: ('Notification' in window) ? Notification.permission : 'unsupported', test: test, v: 1 };
  }
  function hideSplash() { splash.classList.add('gone'); setTimeout(function () { splash.style.display = 'none'; }, 300); }
  setTimeout(hideSplash, 15000);

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.so !== 1 || !okOrigin(e.origin) || e.source !== frame.contentWindow && !isInside(e.source)) return;
    if (d.t === 'hello') {
      appWin = e.source; appOrigin = e.origin;
      e.source.postMessage({ so: 1, t: 'all', items: all(), info: info() }, e.origin);
      hideSplash();
      setTimeout(offer, 4000);
    } else if (d.t === 'set' && typeof d.k === 'string' && /^(so|sura)\.[A-Za-z0-9_.-]{1,60}$/.test(d.k)) {
      var s = store();
      if (s) try { if (d.v === '' || d.v == null) s.removeItem(KEY + d.k); else s.setItem(KEY + d.k, String(d.v)); } catch (err) { /* full */ }
    } else if (d.t === 'notify') {
      notify(d);
    } else if (d.t === 'perm') {
      askNotify();
    }
  });
  // the system's page sits inside Google's own frame: accept messages from any frame inside ours
  function isInside(w) {
    try { for (var x = w, n = 0; x && n < 6; n++) { if (x === frame.contentWindow) return true; if (x === x.parent) break; x = x.parent; } } catch (e) {}
    return false;
  }

  // ---- notifications ----------------------------------------------------------------------------------------
  var reg = null;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').then(function (r) { reg = r; }, function () {});
  function notify(d) {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    var title = String(d.title || 'سورا').slice(0, 120);
    var opts = { body: String(d.body || '').slice(0, 400), icon: 'icon-192.png', badge: 'icon-192.png', dir: 'rtl', lang: 'ar' };
    if (d.tag) opts.tag = String(d.tag).slice(0, 60);
    if (reg && reg.showNotification) reg.showNotification(title, opts).catch(function () {});
    else try { new Notification(title, opts); } catch (e) { /* Android needs the service worker */ }
  }
  function askNotify() {
    if (!('Notification' in window) || Notification.permission !== 'default') { closeBar(); return; }
    Promise.resolve(Notification.requestPermission()).then(function () { closeBar(); tellInfo(); }, closeBar);
  }
  function tellInfo() { try { if (appWin) appWin.postMessage({ so: 1, t: 'info', info: info() }, appOrigin); } catch (e) { /* ignore */ } }

  // ---- one small offer at a time: install the app / allow notifications -------------------------------------
  var bar = document.getElementById('bar'), barText = document.getElementById('bar-text'), barActs = document.getElementById('bar-acts');
  var deferred = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; });
  function later(k) { var s = store(); if (s) try { s.setItem('shell:later:' + k, String(Date.now())); } catch (e) {} }
  function wait(k, days) { var s = store(); var t = s ? Number(s.getItem('shell:later:' + k) || 0) : 0; return t && Date.now() - t < days * 86400000; }
  function closeBar() { bar.classList.remove('on'); }
  function show(text, actions) {
    barText.textContent = text;
    while (barActs.firstChild) barActs.removeChild(barActs.firstChild);
    actions.forEach(function (a) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = a[0]; if (a[2]) b.className = 'go';
      b.addEventListener('click', a[1]); barActs.appendChild(b);
    });
    bar.classList.add('on');
  }
  function offer() {
    var ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    if (!standalone() && ios && !wait('ios', 7)) {
      show('📲 لتثبيت «تطبيق سورا» على الآيفون: اضغط زر المشاركة ⬆️ في Safari ثم «إضافة إلى الشاشة الرئيسية». بعدها افتحه من الأيقونة.',
        [['فهمت', function () { later('ios'); closeBar(); }, true]]);
      return;
    }
    if (!standalone() && deferred && !wait('install', 7)) {
      show('📲 ثبّت «تطبيق سورا» على هذا الجهاز ليفتح من أيقونة مثل أي تطبيق.',
        [['تثبيت', function () { closeBar(); deferred.prompt(); deferred = null; }, true], ['لاحقاً', function () { later('install'); closeBar(); }]]);
      return;
    }
    if ('Notification' in window && Notification.permission === 'default' && !wait('notify', 3)) {
      show('🔔 اسمح بالإشعارات حتى توصلك تنبيهات نظام سورا على هذا الجهاز.',
        [['السماح', askNotify, true], ['لاحقاً', function () { later('notify'); closeBar(); }]]);
    }
  }

  frame.src = test ? TEST : PROD;
})();
</script>
</body>
</html>
